<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diallo HRMS — Enterprise Suite (India)</title>
    <meta
      name="description"
      content="Diallo HRMS — Modern Enterprise Human Resource Management System built for Indian compliance with Firebase Cloud Backend."
    />

    <!-- CSS Architecture Tokens & Components -->
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/tables.css" />
    <link rel="stylesheet" href="css/forms.css" />
    <link rel="stylesheet" href="css/modals.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <!-- Main Application Container Shell -->
    <div class="app-container">
      <!-- ======================================================================
         TOP HEADER
         ====================================================================== -->
      <header class="app-header">
        <!-- Header Left: Logo + Sidebar Toggle -->
        <div class="header-left">
          <button
            class="sidebar-toggle-btn"
            id="sidebar-toggle"
            aria-label="Toggle Sidebar"
            title="Toggle Navigation Sidebar"
          >
            <svg
              width="20"
              height="20"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"
              />
            </svg>
          </button>

          <a href="#dashboard" class="brand-logo">
            <div class="brand-icon-box">D</div>
            <div class="brand-name">
              Diallo <span class="hrms-tag">HRMS</span>
            </div>
          </a>
        </div>

        <!-- Header Center: Global Search -->
        <div class="header-center">
          <button
            class="global-search-trigger"
            id="global-search-trigger"
            aria-label="Global Search"
          >
            <div class="flex items-center gap-2">
              <svg
                width="16"
                height="16"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                />
              </svg>
              <span>Search employees, actions, Indian tax codes, pages...</span>
            </div>
            <span class="search-shortcut-badge">Ctrl K</span>
          </button>
        </div>

        <!-- Header Right: Switchers, Notifications, Theme & Profile -->
        <div class="header-right">
          <!-- Company Selector Dropdown -->
          <div class="dropdown-menu-wrapper">
            <button
              class="header-dropdown-btn"
              data-dropdown-trigger="company-popover"
              title="Switch Company Entity"
            >
              <svg
                width="15"
                height="15"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"
                />
              </svg>
              <span class="label-text" id="current-company-label"
                >Diallo India Private Limited</span
              >
              <svg
                width="12"
                height="12"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 9l-7 7-7-7"
                />
              </svg>
            </button>
            <div class="dropdown-popover" id="company-popover"></div>
          </div>

          <!-- Branch / Location Selector Dropdown -->
          <div class="dropdown-menu-wrapper">
            <button
              class="header-dropdown-btn"
              data-dropdown-trigger="branch-popover"
              title="Switch Office Location"
            >
              <svg
                width="15"
                height="15"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"
                />
              </svg>
              <span class="label-text" id="current-branch-label"
                >HQ - Mumbai</span
              >
              <svg
                width="12"
                height="12"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 9l-7 7-7-7"
                />
              </svg>
            </button>
            <div class="dropdown-popover" id="branch-popover"></div>
          </div>

          <!-- Notification Center -->
          <div class="dropdown-menu-wrapper">
            <button
              class="header-icon-btn"
              onclick="Router.navigate('communication')"
              aria-label="Notifications"
              title="Notifications (Communication Hub)"
              style="position: relative"
            >
              <svg
                width="18"
                height="18"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
                />
              </svg>
              <span
                class="badge badge-primary"
                id="top-nav-notification-badge"
                style="
                  position: absolute;
                  top: -4px;
                  right: -4px;
                  font-size: 0.65rem;
                  padding: 2px 5px;
                  border-radius: 10px;
                  display: none;
                "
                >0</span
              >
            </button>
          </div>

          <!-- Light / Dark Theme Toggle -->
          <button
            class="header-icon-btn theme-toggle-btn"
            aria-label="Toggle Light / Dark Mode"
            title="Toggle Theme (Light / Dark)"
          >
            <span class="theme-icon-container">
              <svg
                width="18"
                height="18"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
                />
              </svg>
            </span>
          </button>

          <!-- User Profile Avatar & Dropdown -->
          <div class="dropdown-menu-wrapper">
            <div
              class="user-profile-trigger"
              data-dropdown-trigger="profile-popover"
              title="User Profile Menu"
            >
              <div class="avatar-img">AD</div>
              <div>
                <div class="user-name-label">Administrator</div>
                <div class="user-role-label">HR Admin</div>
              </div>
              <svg
                width="12"
                height="12"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                style="color: var(--text-muted); margin-left: 2px"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 9l-7 7-7-7"
                />
              </svg>
            </div>
            <div
              class="dropdown-popover"
              id="profile-popover"
              style="width: 240px"
            >
              <div class="dropdown-header">Logged In Account</div>
              <div
                style="
                  padding: 10px 12px;
                  border-bottom: 1px solid var(--border-light);
                "
              >
                <div class="font-semibold text-main user-name-label">
                  Administrator
                </div>
                <div
                  class="text-muted user-role-label"
                  style="font-size: 0.75rem"
                >
                  Super Admin
                </div>
              </div>
              <button
                class="dropdown-item"
                onclick="
                  Router.navigate('settings');
                  document
                    .getElementById('profile-popover')
                    .classList.remove('active');
                "
              >
                <svg
                  width="16"
                  height="16"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
                  />
                </svg>
                <span>Account Settings</span>
              </button>
              <div class="dropdown-divider"></div>
              <button
                class="dropdown-item text-danger"
                onclick="AuthGuard.logout()"
              >
                <svg
                  width="16"
                  height="16"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
                  />
                </svg>
                <span>Sign Out</span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- ======================================================================
         LEFT SIDEBAR (10 Primary Modules)
         ====================================================================== -->
      <aside class="app-sidebar">
        <div class="sidebar-nav-section" id="sidebar-nav">
          <!-- Dynamically rendered by Router.renderDynamicSidebar() -->
        </div>
        <div class="sidebar-footer">
          <div class="workspace-status">
            <div class="flex items-center justify-between" style="margin-bottom: 2px">
              <span class="font-semibold text-main">Diallo India</span>
              <span class="badge badge-success" style="font-size: 0.65rem">Production</span>
            </div>
            <div class="text-muted" style="font-size: 0.7rem">Firebase Connected</div>
          </div>
        </div>
      </aside>

      <!-- Backdrop for Mobile Sidebar -->
      <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

      <!-- ======================================================================
         MAIN CONTENT WRAPPER & VIEWPORT
         ====================================================================== -->
      <div class="main-wrapper">
        <main class="main-content" id="main-content-viewport">
          <!-- Rendered dynamically by Vanilla JS Router -->
        </main>
      </div>
    </div>

    <!-- Toast Notification Portal Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

    <script src="js/firebase/firebase-config.js"></script>
    <script src="js/auth/permissionService.js"></script>

    <script src="js/services/auditService.js"></script>

    <!-- 3. Core UI Libraries -->
    <script src="js/theme.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/modal.js"></script>

    <script src="js/table.js"></script>
    <script src="js/forms.js"></script>

    <script src="js/views/admin-dashboard-view.js"></script>
    <script src="js/views/manager-dashboard-view.js"></script>
    <script src="js/views/employee-dashboard-view.js"></script>

    <script src="js/views/reports-view.js"></script>
    <script src="js/views/admin-view.js"></script>
    <script src="js/views/compliance-view.js"></script>
    <script src="js/views/security-view.js"></script>

    <!-- 5. Router and Coordinator -->

    <script src="js/app.js"></script>

</html>
