<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Diallo HRMS Enterprise Cloud</title>
  <meta name="description" content="Sign in or create a new organization account for Diallo HRMS Enterprise Cloud Suite." />

  <!-- CSS Architecture Tokens & Components -->
  <link rel="stylesheet" href="css/variables.css?v=1793275281408" />
  <link rel="stylesheet" href="css/global.css?v=1793275281408" />
  <link rel="stylesheet" href="css/components.css?v=1793275281408" />
  <link rel="stylesheet" href="css/forms.css?v=1793275281408" />
  <link rel="stylesheet" href="css/modals.css?v=1793275281408" />
  <link rel="stylesheet" href="css/responsive.css?v=1793275281408" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=1793275281408" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=1793275281408" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=1793275281408" />
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?v=1793275281408" />

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-app, #f8fafc);
      padding: 24px 16px;
      font-family: var(--font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      color: var(--text-main, #0f172a);
    }
    .auth-card {
      width: 100%;
      max-width: 480px;
      background-color: var(--bg-card, #ffffff);
      border: 1px solid var(--border-main, #e2e8f0);
      border-radius: var(--radius-lg, 12px);
      box-shadow: var(--shadow-lg, 0 10px 15px -3px rgba(0, 0, 0, 0.08));
      padding: 36px 32px;
      position: relative;
      transition: all var(--transition-speed, 0.2s);
      color: var(--text-main, #0f172a);
    }
    .form-label {
      color: var(--text-main, #0f172a) !important;
      font-weight: 600;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 6px;
    }
    .form-label.required::after {
      content: '*';
      color: var(--danger, #dc2626);
      font-weight: 700;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .auth-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      text-decoration: none;
    }
    .auth-logo .brand-icon-box {
      width: 44px;
      height: 44px;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      font-size: 1.35rem;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      overflow: hidden;
    }
    .auth-logo .brand-icon-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .auth-logo .brand-name {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--text-main);
    }
    .auth-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }
    .auth-subtitle {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    
    /* Auth Navigation Tabs */
    .auth-tabs {
      display: flex;
      background: var(--bg-hover);
      padding: 4px;
      border-radius: var(--radius-md);
      margin-bottom: 24px;
      border: 1px solid var(--border-light);
    }
    .auth-tab-btn {
      flex: 1;
      padding: 9px 12px;
      font-size: 0.875rem;
      font-weight: 600;
      text-align: center;
      background: transparent;
      border: none;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .auth-tab-btn.active {
      background: var(--bg-card);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    /* Alert Message Box */
    .auth-alert {
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      margin-bottom: 18px;
      display: none;
      line-height: 1.4;
    }
    .auth-alert.error {
      display: block;
      background: rgba(220, 38, 38, 0.1);
      color: var(--danger);
      border: 1px solid rgba(220, 38, 38, 0.25);
    }
    .auth-alert.success {
      display: block;
      background: rgba(22, 163, 74, 0.1);
      color: var(--success);
      border: 1px solid rgba(22, 163, 74, 0.25);
    }

    /* Password field with toggle */
    .password-input-wrapper {
      position: relative;
    }
    .password-toggle-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .password-toggle-btn:hover {
      color: var(--text-main);
    }

    .theme-toggle-fixed {
      position: absolute;
      top: 16px;
      right: 16px;
    }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="auth-card animate-fade-in">
    <!-- Theme Toggle Button -->
    <button type="button" class="header-icon-btn theme-toggle-btn theme-toggle-fixed" aria-label="Toggle Theme" title="Toggle Light / Dark Theme">
      <span class="theme-icon-container">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      </span>
    </button>

    <div class="auth-header">
      <div class="auth-logo">
        <div class="brand-icon-box"><img src="d-hrms-favicon.png" alt="Diallo Logo" /></div>
        <div class="brand-name">Diallo <span class="hrms-tag">HRMS</span></div>
      </div>
      <h1 class="auth-title" id="auth-title">Welcome Back</h1>
      <p class="auth-subtitle" id="auth-subtitle">Sign in to access your organization workspace</p>
    </div>

    <!-- Sign In / Sign Up Tab Switcher -->
    

    <!-- Alert Box -->
    <div id="auth-alert" class="auth-alert"></div>

    <!-- ======================================================================
         1. SIGN IN FORM
         ====================================================================== -->
    <form id="login-form" onsubmit="handleLoginSubmit(event)">
      <div class="form-group" style="margin-bottom: 16px;">
        <label class="form-label required">Official Email or Employee Code</label>
        <input type="text" id="login-email" class="form-control" placeholder="name@company.com or Employee Code" required autofocus />
      </div>

      <div class="form-group" style="margin-bottom: 16px;">
        <label class="form-label required">Password</label>
        <div class="password-input-wrapper">
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required />
          <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('login-password', this)" title="Show / Hide Password">
            <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between" style="margin-bottom: 20px;">
        <label style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-secondary); cursor: pointer;">
          <input type="checkbox" id="remember-me" checked />
          <span>Remember this session</span>
        </label>
      </div>

      <button type="submit" id="login-submit-btn" class="btn btn-primary btn-lg w-full">
        <span>Sign In to HRMS</span>
      </button>
    </form>

    <!-- ======================================================================
         2. SIGN UP (REGISTER) FORM
         ====================================================================== -->
    
    <div class="auth-footer">
      <p>© 2026 Diallo India Private Limited • Enterprise Portal</p>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <!-- App Services & Architecture (100% Hostinger MySQL & PHP Backend) -->
  <script src="js/firebase/firebase-config.js?v=1793275281408"></script>
  <script src="js/theme.js?v=1793275281408"></script>
  <script src="js/toast.js?v=1793275281408"></script>
  <script src="js/services/apiClient.js?v=1793275281408"></script>
  <script src="js/services/authService.js?v=1793275281408"></script>
  <script src="js/services/auditService.js?v=1793275281408"></script>
  <script src="js/firebase/auth-guard.js?v=1793275281408"></script>

  <script>
    

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.style.color = 'var(--primary)';
      } else {
        input.type = 'password';
        btn.style.color = 'var(--text-muted)';
      }
    }


    let isAuthenticating = false;

    // Explicit Sign In Handler (always called directly by onsubmit)
    async function handleLoginSubmit(event) {
      event.preventDefault();

      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const alertBox = document.getElementById('auth-alert');
      const loginBtn = document.getElementById('login-submit-btn');

      if (!email || !password) return;

      isAuthenticating = true;
      alertBox.className = 'auth-alert';
      alertBox.style.display = 'none';

      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span>Verifying credentials...</span>';

      try {
        const res = await Promise.race([
          authService.signIn(email, password),
          new Promise((resolve) => setTimeout(() => resolve({ success: false, error: 'Authentication request timed out. Please check your network connection.' }), 12000))
        ]);

        if (res.success) {
          loginBtn.innerHTML = '<span>Success! Opening Dashboard...</span>';
          Toast.success('Authenticated successfully!');
          const redirect = sessionStorage.getItem('redirect_after_login') || 'index.html#dashboard';
          sessionStorage.removeItem('redirect_after_login');
          window.location.replace(redirect);
        } else {
          isAuthenticating = false;
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<span>Sign In to HRMS</span>';

          alertBox.textContent = res.error || 'Invalid email or password. Please verify your credentials.';
          alertBox.className = 'auth-alert error';
          alertBox.style.display = 'block';
        }
      } catch (err) {
        isAuthenticating = false;
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<span>Sign In to HRMS</span>';
        alertBox.textContent = err.message || 'An unexpected error occurred during sign in.';
        alertBox.className = 'auth-alert error';
        alertBox.style.display = 'block';
      }
    }

    // Explicit Sign Up Handler (always called directly by onsubmit)
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        ThemeManager.init();
        Toast.init();
      } catch (e) {
        console.warn('UI init warning:', e);
      }
      if (window.AuthGuard) {
        await AuthGuard.init({ isPublicPage: true });
      }
    });
  </script>
</body>
</html>
