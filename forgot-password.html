<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Diallo HRMS</title>
  <meta name="description" content="Recover your Diallo HRMS account password." />

  <!-- CSS Architecture Tokens & Components -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/modals.css" />
  <link rel="stylesheet" href="css/responsive.css" />

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-body);
      padding: 20px;
      font-family: var(--font-family-base);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-surface);
      border: 1px solid var(--border-main);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 36px 32px;
      position: relative;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      text-decoration: none;
    }
    .auth-logo .brand-icon-box {
      width: 40px;
      height: 40px;
      background: var(--primary);
      color: #fff;
      font-weight: 800;
      font-size: 1.25rem;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-logo .brand-name {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
    }
    .auth-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }
    .auth-subtitle {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .auth-alert {
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      margin-bottom: 18px;
      display: none;
    }
    .auth-alert.error {
      display: block;
      background: rgba(220, 38, 38, 0.1);
      color: var(--danger);
      border: 1px solid rgba(220, 38, 38, 0.2);
    }
    .auth-alert.success {
      display: block;
      background: rgba(22, 163, 74, 0.1);
      color: var(--success);
      border: 1px solid rgba(22, 163, 74, 0.2);
    }
    .theme-toggle-fixed {
      position: absolute;
      top: 16px;
      right: 16px;
    }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="auth-card animate-fade-in">
    <!-- Theme Toggle Button -->
    <button class="header-icon-btn theme-toggle-btn theme-toggle-fixed" aria-label="Toggle Theme" title="Toggle Theme">
      <span class="theme-icon-container">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      </span>
    </button>

    <div class="auth-header">
      <div class="auth-logo">
        <div class="brand-icon-box">D</div>
        <div class="brand-name">Diallo <span class="hrms-tag">HRMS</span></div>
      </div>
      <h1 class="auth-title">Reset Password</h1>
      <p class="auth-subtitle">Enter your official email to receive a password reset link</p>
    </div>

    <!-- Alert Box -->
    <div id="auth-alert" class="auth-alert"></div>

    <!-- Reset Form -->
    <form id="reset-form">
      <div class="form-group" style="margin-bottom: 20px;">
        <label class="form-label required">Official Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="employee@diallo.in" required autofocus />
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary btn-lg w-full">
        <span>Send Reset Link</span>
      </button>
    </form>

    <div class="auth-footer">
      <a href="login.html" style="color: var(--primary); text-decoration: none; font-weight: 500;">← Back to Sign In</a>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <!-- Firebase Web SDK (Compat CDN) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

  <!-- App Services & Config -->
  <script src="js/firebase/firebase-config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/services/auditService.js"></script>
  <script src="js/services/authService.js"></script>
  <script src="js/firebase/auth-guard.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      ThemeManager.init();
      Toast.init();

      const form = document.getElementById('reset-form');
      const submitBtn = document.getElementById('submit-btn');
      const alertBox = document.getElementById('auth-alert');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        if (!email) return;

        alertBox.className = 'auth-alert';
        alertBox.style.display = 'none';

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>Sending email...</span>';

        const res = await authService.sendPasswordReset(email);

        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Send Reset Link</span>';

        if (res.success) {
          alertBox.textContent = res.message;
          alertBox.className = 'auth-alert success';
          alertBox.style.display = 'block';
          form.reset();
        } else {
          alertBox.textContent = res.error;
          alertBox.className = 'auth-alert error';
          alertBox.style.display = 'block';
        }
      });
    });
  </script>
</body>
</html>
